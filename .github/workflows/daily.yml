name: Daily viral videos

on:
  schedule:
    - cron: '7,27,47 * * * *'   # GitHub skips many scheduled runs, so try 3x per hour; the script only refreshes what is due
  workflow_dispatch:       # "Run workflow" button = full update (also uses Apify credit)

permissions:
  contents: write

concurrency:
  group: daily-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Manual run = full update
        id: mode
        run: echo "full=${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}" >> "$GITHUB_OUTPUT"
      - name: Fetch the GTA 6 videos
        id: fetch
        env:
          YT_KEY: ${{ secrets.YT_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FULL: ${{ steps.mode.outputs.full }}
        run: node scripts/fetch.mjs
      - name: Make today's Instagram post
        if: steps.fetch.outputs.full == '1'
        continue-on-error: true
        run: node scripts/post.mjs out/post
      - name: Keep the post for download
        if: steps.fetch.outputs.full == '1'
        uses: actions/upload-artifact@v4
        with:
          name: instagram-post
          path: out/post
          if-no-files-found: ignore
          retention-days: 14
      - name: Save the list
        run: |
          git config user.name "viralgta6-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet && exit 0
          git commit -m "GTA 6 videos $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase -q && git push
